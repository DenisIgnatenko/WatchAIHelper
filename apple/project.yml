# XcodeGen specification of the Xcode project.
# The .xcodeproj is GENERATED from this file and is not committed:
#  cd apple && xcodegen
# Why: project.pbxproj is a large machine-written file that produces unreadable diffs and merge
# conflicts. This YAML is the reviewable single source of truth for targets and settings.

name: AICopilot

options:
 deploymentTarget:
  iOS: "27.0"
  watchOS: "27.0"
 # Owner's formatting rule: one space per indentation level (also in .editorconfig).
 indentWidth: 1
 tabWidth: 1
 usesTabs: false
 createIntermediateGroups: true

# Signing and bundle identifiers come from Config/Signing.local.xcconfig (git-ignored),
# so every developer builds with their own Apple team.
configFiles:
 Debug: Config/Base.xcconfig
 Release: Config/Base.xcconfig

packages:
 CopilotKit:
  path: Packages/CopilotKit

settings:
 base:
  SWIFT_VERSION: "6.0"
  MARKETING_VERSION: "0.1.0"
  CURRENT_PROJECT_VERSION: "1"
  CODE_SIGN_STYLE: Automatic

targets:
 AICopilot:
  type: application
  platform: iOS
  # iOSShared: code compiled into both the iOS app and its widget extension (AskWithCameraIntent).
  sources: [iOS, iOSShared]
  # Backend connection from the xcconfig (see Config/Base.xcconfig). Merged with the generated Info.plist.
  info:
   path: iOS/Info.plist
   properties:
    CopilotHost: $(COPILOT_HOST)
    CopilotDeviceToken: $(COPILOT_DEVICE_TOKEN)
    # Custom URL scheme: aicopilot://camera opens the camera. Used by a Shortcuts "Open URLs" action
    # assigned to the iPhone Action Button (reliable path; see docs PI 2.6).
    CFBundleURLTypes:
     - CFBundleURLName: aicopilot
       CFBundleURLSchemes: [aicopilot]
  dependencies:
   - package: CopilotKit
     product: CopilotCore
   # Embeds the Watch app into the iOS app (installed on the watch together with it).
   - target: AICopilotWatch
   # Embeds the iOS widget extension (Controls).
   - target: AICopilotWidgets
  settings:
   base:
    PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).AICopilot
    TARGETED_DEVICE_FAMILY: "1"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: AI Copilot
    # iOS/Assets.xcassets; drawn by scripts/make-app-icon.swift.
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
    INFOPLIST_KEY_NSCameraUsageDescription: AI Copilot photographs pages and documents to answer questions about them.

 AICopilotWatch:
  type: application
  platform: watchOS
  # WatchShared: code compiled into both the Watch app and its widget extension (AskAIIntent).
  sources: [Watch, WatchShared]
  # Backend connection from the xcconfig (see Config/Base.xcconfig). Merged with the generated Info.plist.
  info:
   path: Watch/Info.plist
   properties:
    CopilotHost: $(COPILOT_HOST)
    CopilotDeviceToken: $(COPILOT_DEVICE_TOKEN)
  dependencies:
   - package: CopilotKit
     product: CopilotCore
   # Embeds the widget extension (Controls) into the Watch app.
   - target: AICopilotWatchWidgets
  settings:
   base:
    PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).AICopilot.watchkitapp
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: AI Copilot
    # Watch/Assets.xcassets; the same drawing as the iPhone icon (watchOS masks it to a circle).
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    # Links the watch app to its iOS companion.
    INFOPLIST_KEY_WKCompanionAppBundleIdentifier: $(BUNDLE_ID_PREFIX).AICopilot
    # The watch app talks to the backend itself and must not require the iPhone app to be running.
    INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: YES
    SKIP_INSTALL: YES

 # Watch widget extension. Hosts the "Ask AI" Control (the supported route to the Ultra Action Button,
 # watchOS 26+) and the complication / Smart Stack widget (spec 40), which reads GET /v1/home itself.
 AICopilotWatchWidgets:
  type: app-extension
  platform: watchOS
  sources: [WatchWidgets, WatchShared]
  info:
   path: WatchWidgets/Info.plist
   properties:
    CFBundleDisplayName: AI Copilot
    # The complication asks the backend itself (same build-time configuration as the app).
    CopilotHost: $(COPILOT_HOST)
    CopilotDeviceToken: $(COPILOT_DEVICE_TOKEN)
    # Must match the containing app's version.
    CFBundleShortVersionString: $(MARKETING_VERSION)
    CFBundleVersion: $(CURRENT_PROJECT_VERSION)
    NSExtension:
     NSExtensionPointIdentifier: com.apple.widgetkit-extension
  dependencies:
   - package: CopilotKit
     product: CopilotCore
  settings:
   base:
    PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).AICopilot.watchkitapp.widgets
    SKIP_INSTALL: YES

 # iOS widget extension. Hosts the "Ask with Camera" Control for the iPhone Action Button.
 AICopilotWidgets:
  type: app-extension
  platform: iOS
  sources: [iOSWidgets, iOSShared]
  info:
   path: iOSWidgets/Info.plist
   properties:
    CFBundleDisplayName: AI Copilot
    CFBundleShortVersionString: $(MARKETING_VERSION)
    CFBundleVersion: $(CURRENT_PROJECT_VERSION)
    NSExtension:
     NSExtensionPointIdentifier: com.apple.widgetkit-extension
  settings:
   base:
    PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).AICopilot.widgets
    SKIP_INSTALL: YES
