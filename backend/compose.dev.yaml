# Local development database only (the backend itself runs from the IDE / `mvn spring-boot:run`).
#  docker compose -f compose.dev.yaml up -d
# Production uses deploy/docker-compose.yml.
services:
 postgres:
  image: postgres:17-alpine
  environment:
   POSTGRES_DB: copilot
   POSTGRES_USER: copilot
   POSTGRES_PASSWORD: copilot
  ports:
   # Bound to localhost only: not reachable from the network.
   - "127.0.0.1:5432:5432"
  volumes:
   - pgdata-dev:/var/lib/postgresql/data

volumes:
 pgdata-dev:
